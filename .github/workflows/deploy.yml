name: Déploiement

# Construit l'image à chaque push sur `main` et la pousse dans GHCR, que
# Coolify vient ensuite chercher. Le tag suit le nom du dépôt : il n'y a donc
# rien à paramétrer ici, l'image est toujours `ghcr.io/<owner>/<repo>:latest`.

on:
  push:
    branches: [main]
  # Relance manuelle depuis l'onglet Actions, pour retester un déploiement.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      # Le token par défaut `GITHUB_TOKEN` suffit à pousser sur GHCR tant que
      # le dépôt autorise les workflows. Aucune clé de compte à configurer.
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # QEMU + buildx : l'image construite ici tourne en `linux/amd64`.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La seule variable inlinée au build. C'est une clé anon publishable :
      # elle n'est pas secrète et finit dans le bundle client.
      - name: Valeurs de build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}

      # Pas de `docker/login-action` pour Supabase : les clés secrètes ne sont
      # PAS des variables de build. Elles sont configurées dans Coolify, qui
      # les injecte au démarrage du conteneur. Voir docs/ROADMAP.md (M8).

      - name: Résumé
        run: |
          echo "Image poussée : ${{ env.REGISTRY }}/${{ github.repository }}:latest"