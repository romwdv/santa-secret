name: Déploiement

# Construit l'image à chaque push sur `main` et la pousse dans GHCR, que
# Coolify vient ensuite chercher. Le tag suit le nom du dépôt : il n'y a donc
# rien à paramétrer ici, l'image est toujours `ghcr.io/<owner>/<repo>:latest`.

on:
  push:
    branches: [main]
  # Relance manuelle depuis l'onglet Actions, pour retester un déploiement.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      # Le token par défaut `GITHUB_TOKEN` suffit à pousser sur GHCR tant que
      # le dépôt autorise les workflows. Aucune clé de compte à configurer.
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # QEMU + buildx : l'image construite ici tourne en `linux/amd64`.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Seule variable inlinée au build. C'est une clé anon publishable :
      # elle n'est pas secrète et finit dans le bundle client. Elle est aussi
      # requise au RUNTIME — voir le rappel dans le Dockerfile.
      - name: Valeurs de build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}

      # Les clés secrètes ne sont PAS des variables de build : elles sont
      # configurées dans Coolify, qui les injecte au démarrage du conteneur.
      # Voir docs/DEPLOIEMENT.md.

      # Déploiement automatique. L'étape est conditionnelle pour que le build
      # reste vert tant que le webhook n'est pas configuré.
      #
      # Coolify n'a aucune raison de redéployer tout seul : la ressource est de
      # type « Docker Image », sans dépôt Git rattaché. Son « Deploy on push »
      # ne concerne que les applications connectées à un dépôt. C'est donc
      # l'image publiée qui déclenche le déploiement, d'où cet appel.
      #
      # Volontairement APRÈS le push : Coolify tire `latest`, qui doit donc
      # pointer la nouvelle image, sinon il redéploie l'ancienne.
      - name: Déployer sur Coolify
        if: ${{ secrets.COOLIFY_WEBHOOK != '' }}
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          # Optionnel : seulement si le webhook exige une authentification.
          # Au-delà de 10 octets pour ne pas envoyer d'en-tête vide.
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          auth=()
          if [ -n "$COOLIFY_TOKEN" ]; then
            auth=(--header "Authorization: Bearer $COOLIFY_TOKEN")
          fi
          curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK" "${auth[@]}"

      - name: Résumé
        run: |
          echo "Image poussée : ${{ env.REGISTRY }}/${{ github.repository }}:latest"